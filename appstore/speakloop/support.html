<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakLoop - 帮助与支持</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #f5f8f6; color: #1d2d28; line-height: 1.75; }
    main { max-width: 720px; margin: 0 auto; padding: 52px 24px 80px; }
    h1 { font-size: 2rem; }
    h2 { margin-top: 34px; font-size: 1.08rem; }
    p { color: #52645e; }
    .card { margin-top: 28px; padding: 22px; background: white; border: 1px solid #e1e9e5; border-radius: 20px; }
    a { color: #276b55; }
  </style>
</head>
<body>
  <main>
    <h1>SpeakLoop 帮助与支持</h1>
    <p>如果你在课程、录音、语音识别或学习进度方面遇到问题，可以通过本页面联系我们。</p>
    <div class="card">
      <h2>录音或语音反馈无法使用</h2>
      <p>请前往 iOS“设置”检查 SpeakLoop 的麦克风和语音识别权限。即使不授予权限，你仍可以继续听音频和完成不依赖录音的练习。</p>
      <h2>学习进度与录音存在哪里？</h2>
      <p>学习进度和录音保存在设备本地。SpeakLoop 当前没有账号或云同步服务，卸载应用会同时删除本地数据。</p>
      <h2>联系我们</h2>
      <p>请发送邮件至 <a href="mailto:tempterli@gmail.com?subject=SpeakLoop%20Support">tempterli@gmail.com</a>，并附上设备型号、iOS 版本和问题描述。</p>
    </div>
    <p><a href="privacy-policy-zh.html">查看隐私政策</a></p>
  </main>
</body>
</html>
