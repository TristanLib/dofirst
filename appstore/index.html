<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoFirst</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f14;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center {
      text-align: center;
      padding: 40px 24px;
      max-width: 680px;
    }
    h1 {
      font-size: 2.7rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    p {
      margin-top: 12px;
      color: #a7b0bb;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .links {
      margin-top: 40px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a {
      color: #5ac8fa;
      text-decoration: none;
      font-size: 0.95rem;
      padding: 10px 20px;
      border: 1px solid #5ac8fa;
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }
    a:hover {
      background: #5ac8fa;
      color: #0b0f14;
    }
  </style>
</head>
<body>
  <main class="center">
    <h1>DoFirst</h1>
    <p>Finish what matters first, then unlock entertainment time.</p>
    <div class="links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="privacy-policy-zh.html">隐私政策</a>
    </div>
  </main>
</body>
</html>
